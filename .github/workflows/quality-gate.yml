name: SiteDocs Quality Gate

on:
  push:
    branches:
      - "implementation/**"
  pull_request:
    branches:
      - "main"
      - "dev/**"

permissions:
  contents: read

concurrency:
  group: sitedocs-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      - name: Run unit tests
        run: bun run test

      - name: Build production application
        run: bun run build
