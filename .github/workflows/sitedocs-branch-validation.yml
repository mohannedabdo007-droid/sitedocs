name: SiteDocs branch validation

on:
  push:
    branches:
      - fix/project-membership-authorization-2026-11-16
  pull_request:
    branches:
      - fix/project-membership-authorization-2026-11-16
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitedocs-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-validation:
    name: TypeScript, Vitest, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Generate TanStack file routes
        run: bun run build

      - name: Validate TypeScript
        run: bun run typecheck

      - name: Run Vitest
        run: bun run test

      - name: Verify final production build
        run: bun run build

  postgres-jv-acceptance:
    name: Isolated PostgreSQL migrations and JV acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sitedocs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sitedocs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sitedocs_test
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Bootstrap minimal Supabase-compatible auth and storage schemas
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create schema auth;
          create table auth.users (
            id uuid primary key,
            email text unique,
            raw_user_meta_data jsonb not null default '{}'::jsonb
          );
          create or replace function auth.uid()
          returns uuid language sql stable
          as $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          create schema storage;
          create table storage.buckets (
            id text primary key,
            name text not null,
            public boolean not null default false
          );
          create table storage.objects (
            id uuid primary key default gen_random_uuid(),
            bucket_id text not null references storage.buckets(id),
            name text not null
          );
          -- Supabase Storage enforces object policies with RLS enabled by default.
          alter table storage.objects enable row level security;
          insert into storage.buckets (id, name, public)
          values ('document-files', 'document-files', false);
          grant usage on schema auth, storage to anon, authenticated, service_role;
          grant select on auth.users to authenticated, service_role;
          grant select, insert, update, delete on storage.objects to authenticated, service_role;
          grant select, update on storage.buckets to authenticated, service_role;
          SQL

      - name: Apply all project migrations to disposable PostgreSQL
        run: |
          for migration in \
            drizzle/migrations/0000_core_schema.sql \
            drizzle/migrations/0001_triggers_and_rpcs.sql \
            drizzle/migrations/0002_storage_policies.sql \
            drizzle/migrations/0003_import_validation_and_kpi_buckets.sql \
            drizzle/migrations/0004_p0_draft_confidentiality_and_audit.sql \
            drizzle/migrations/0005_company_acceptance_membership.sql \
            drizzle/migrations/0006_company_search_and_joint_ventures.sql
          do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Create deterministic company and project fixtures
        run: psql -v ON_ERROR_STOP=1 -f drizzle/tests/ci_membership_fixture.sql

      - name: Run company invitation and JV acceptance tests
        run: |
          psql -v ON_ERROR_STOP=1 \
            -v project_id=20000000-0000-4000-8000-000000000001 \
            -v project_company_id=10000000-0000-4000-8000-000000000001 \
            -v owner_admin_user_id=00000000-0000-4000-8000-000000000001 \
            -v invited_company_id=10000000-0000-4000-8000-000000000002 \
            -v invited_company_admin_user_id=00000000-0000-4000-8000-000000000002 \
            -v invited_member_user_id=00000000-0000-4000-8000-000000000003 \
            -v invited_member_email=external-member@sitedocs.test \
            -v jv_company_id=10000000-0000-4000-8000-000000000003 \
            -v jv_company_admin_user_id=00000000-0000-4000-8000-000000000004 \
            -v jv_member_user_id=00000000-0000-4000-8000-000000000005 \
            -v jv_member_email=jv-member@sitedocs.test \
            -f drizzle/tests/company_search_and_joint_ventures.acceptance.sql

      - name: Create isolated P0 draft, PM, Storage and tenant fixtures
        run: psql -v ON_ERROR_STOP=1 -f drizzle/tests/ci_p0_draft_audit_fixture.sql

      - name: Run P0 draft confidentiality, self-review, Storage RLS and RPC acceptance tests
        run: |
          psql -v ON_ERROR_STOP=1 \
            -v creator_user_id=00000000-0000-4000-8000-000000000010 \
            -v originator_peer_user_id=00000000-0000-4000-8000-000000000011 \
            -v wrong_party_user_id=00000000-0000-4000-8000-000000000012 \
            -v current_reviewer_user_id=00000000-0000-4000-8000-000000000013 \
            -v project_manager_user_id=00000000-0000-4000-8000-000000000014 \
            -v viewer_not_pm_user_id=00000000-0000-4000-8000-000000000015 \
            -v company_admin_user_id=00000000-0000-4000-8000-000000000016 \
            -v company_owner_user_id=00000000-0000-4000-8000-000000000017 \
            -v other_tenant_user_id=00000000-0000-4000-8000-000000000018 \
            -v draft_document_id=30000000-0000-4000-8000-000000000010 \
            -v submitted_document_id=30000000-0000-4000-8000-000000000011 \
            -v self_review_document_id=30000000-0000-4000-8000-000000000012 \
            -v attachment_path=20000000-0000-4000-8000-000000000010/30000000-0000-4000-8000-000000000010/draft.pdf \
            -v project_id=20000000-0000-4000-8000-000000000010 \
            -v other_party_import_batch_id=60000000-0000-4000-8000-000000000010 \
            -v draft_ocr_job_id=50000000-0000-4000-8000-000000000010 \
            -f drizzle/tests/p0_draft_audit_rls.acceptance.sql

  supabase-api-storage-acceptance:
    name: Supabase Auth, PostgREST, and Storage API acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      # Pin CLI v2: CLI v3 changed hosted/local command behavior in November 2026.
      # This job starts only a local Docker stack and never links to a hosted project.
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Start isolated local Supabase Auth, REST, and Storage services
        run: |
          supabase --version
          supabase start --exclude studio,mail,realtime,functions,analytics,pooler
          supabase status -o env >> "$GITHUB_ENV"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply SiteDocs migrations to local Supabase database
        run: |
          for migration in \
            drizzle/migrations/0000_core_schema.sql \
            drizzle/migrations/0001_triggers_and_rpcs.sql \
            drizzle/migrations/0002_storage_policies.sql \
            drizzle/migrations/0003_import_validation_and_kpi_buckets.sql \
            drizzle/migrations/0004_p0_draft_confidentiality_and_audit.sql \
            drizzle/migrations/0005_company_acceptance_membership.sql \
            drizzle/migrations/0006_company_search_and_joint_ventures.sql
          do
            echo "Applying $migration to local Supabase"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "create extension if not exists pgcrypto with schema extensions;"

      - name: Create synthetic Auth users, projects, documents, and attachment metadata
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f drizzle/tests/ci_p0_draft_audit_fixture.sql

      - name: Run existing P0 SQL authorization acceptance against Supabase PostgreSQL
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -v creator_user_id=00000000-0000-4000-8000-000000000010 \
            -v originator_peer_user_id=00000000-0000-4000-8000-000000000011 \
            -v wrong_party_user_id=00000000-0000-4000-8000-000000000012 \
            -v current_reviewer_user_id=00000000-0000-4000-8000-000000000013 \
            -v project_manager_user_id=00000000-0000-4000-8000-000000000014 \
            -v viewer_not_pm_user_id=00000000-0000-4000-8000-000000000015 \
            -v company_admin_user_id=00000000-0000-4000-8000-000000000016 \
            -v company_owner_user_id=00000000-0000-4000-8000-000000000017 \
            -v other_tenant_user_id=00000000-0000-4000-8000-000000000018 \
            -v draft_document_id=30000000-0000-4000-8000-000000000010 \
            -v submitted_document_id=30000000-0000-4000-8000-000000000011 \
            -v self_review_document_id=30000000-0000-4000-8000-000000000012 \
            -v attachment_path=20000000-0000-4000-8000-000000000010/30000000-0000-4000-8000-000000000010/draft.pdf \
            -v project_id=20000000-0000-4000-8000-000000000010 \
            -v other_party_import_batch_id=60000000-0000-4000-8000-000000000010 \
            -v draft_ocr_job_id=50000000-0000-4000-8000-000000000010 \
            -f drizzle/tests/p0_draft_audit_rls.acceptance.sql

      - name: Remove SQL-only object metadata before seeding real Storage bytes
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "delete from storage.objects where bucket_id = 'document-files' and name = '20000000-0000-4000-8000-000000000010/30000000-0000-4000-8000-000000000010/draft.pdf';"

      - name: Exercise real Auth, PostgREST, Storage download, signed URLs, uploads, and RPCs
        run: node drizzle/tests/p0_supabase_api.acceptance.mjs

      - name: Stop isolated Supabase stack
        if: always()
        run: supabase stop --no-backup
