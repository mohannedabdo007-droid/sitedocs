name: Deploy SiteDocs MCP Gateway

on:
  push:
    branches:
      - fix/cloudflare-workers-build-2026-11-13
    paths:
      - "services/sitedocs-mcp-gateway/**"
      - ".github/workflows/deploy-sitedocs-mcp-gateway.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sitedocs-mcp-gateway
    steps:
      - name: Checkout approved development branch
        uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-workers-build-2026-11-13

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run gateway tests
        run: npm test

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run

      - name: Deploy isolated MCP Gateway
        run: npx wrangler deploy --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "8443941e05881f4c5ea550c7ee0b2097"
