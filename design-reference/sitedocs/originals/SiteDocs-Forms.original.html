<style>
/* Concept: a form library beside a paper sheet. The sheet stays white in both themes, like real paper.
   Four logo slots on top, comment boxes for contractor / consultant / owner, a QR carrying the request number. */
:root{
  --bg:#eceff3; --surface:#ffffff; --surface-2:#f3f5f8; --ink:#16202e; --muted:#566275; --line:#d3d9e2;
  --accent:#0b5c72; --on-accent:#ffffff; --accent-soft:#dcedf2;
  --b:#1b7a4b; --b-bg:#e0f2e8; --c:#b3261e; --c-bg:#fbe6e4; --p:#965800; --p-bg:#faeed6;
  --paper:#ffffff; --paper-ink:#16202e; --paper-line:#c9d0da; --paper-soft:#f3f5f8; --paper-muted:#566275;
  --font-ui:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif; --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#17202a; --surface-2:#1e2935; --ink:#e7ecf2; --muted:#9aa7b7; --line:#2b3745;
  --accent:#52b8d4; --on-accent:#08212a; --accent-soft:#143240;
  --b:#56c28e; --b-bg:#14332a; --c:#ff8f86; --c-bg:#3a1c1b; --p:#f2b660; --p-bg:#36290f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#17202a; --surface-2:#1e2935; --ink:#e7ecf2; --muted:#9aa7b7; --line:#2b3745;
  --accent:#52b8d4; --on-accent:#08212a; --accent-soft:#143240;
  --b:#56c28e; --b-bg:#14332a; --c:#ff8f86; --c-bg:#3a1c1b; --p:#f2b660; --p-bg:#36290f; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--font-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin-inline:auto;padding-block:12px 56px}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.brand{display:flex;gap:10px;align-items:center;font-weight:700;font-size:18px}
.brand small{font-weight:400;font-size:12px;color:var(--muted)}
.mark{width:30px;height:30px;border-radius:6px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:500 12px var(--font-mono)}
.btn{font:inherit;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.small{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.list{display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
@media (max-width:820px){.list{display:flex;overflow-x:auto}}
.list button{font:inherit;text-align:start;background:none;border:0;border-radius:6px;padding:8px 10px;color:var(--muted);cursor:pointer;display:grid;gap:0;white-space:nowrap}
.list button b{font:500 13px var(--font-mono);color:var(--ink)} .list button span{font-size:12px}
.list button[aria-current="true"]{background:var(--accent-soft)} .list button[aria-current="true"] b{color:var(--accent)}
.bar{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;margin-bottom:16px}
.bar .r{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.bar label{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.bar input,.bar select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
.steps{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.step{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.step.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.note{font-size:12px;color:var(--p);background:var(--p-bg);border-radius:6px;padding:6px 10px}
.msg{color:var(--c);font-size:13px}

/* ---- the paper sheet ---- */
.sheet{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:6px;padding:clamp(14px,3vw,28px);display:grid;gap:18px;min-width:0}
.sheet *{border-color:var(--paper-line)}
.logos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.logos{grid-template-columns:repeat(2,1fr)}}
.logo{display:grid;gap:4px;justify-items:center;font-size:11px;color:var(--paper-muted);text-align:center}
.logo .box{width:100%;aspect-ratio:3/2;max-height:84px;border:1.5px dashed var(--paper-line);border-radius:6px;display:grid;place-items:center;overflow:hidden;background:var(--paper-soft);cursor:pointer}
.logo .box img{max-width:100%;max-height:100%;object-fit:contain}
.logo input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.logo .box:focus-within{outline:2px solid var(--accent)}
.title{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap;border-block:2px solid var(--paper-ink);padding-block:10px}
.title h2{margin:0;font-size:20px;text-wrap:balance} .title small{display:block;color:var(--paper-muted);font-size:12px}
.phase{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--paper-soft)}
.phase.B{background:var(--b-bg);color:var(--b)} .phase.C{background:var(--c-bg);color:var(--c)}
.qr{display:grid;gap:3px;justify-items:center;font-size:10px;color:var(--paper-muted)}
.qr #qrbox{width:92px;height:92px;background:#fff;display:grid;place-items:center;padding:3px;border:1px solid var(--paper-line)}
.qr #qrbox img,.qr #qrbox canvas{max-width:100%;height:auto}
.refrow{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
@media (max-width:560px){.refrow{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.fld{display:grid;gap:4px;min-width:0} .fld.full{grid-column:1/-1}
.fld label,.fld .lbl{font-size:12px;color:var(--paper-muted);font-weight:600}
.sheet input,.sheet select,.sheet textarea{font:inherit;color:var(--paper-ink);background:var(--paper);border:1px solid var(--paper-line);border-radius:4px;padding:7px 9px;width:100%;min-width:0}
.sheet input:disabled,.sheet select:disabled,.sheet textarea:disabled{background:var(--paper-soft);color:var(--paper-muted)}
.sheet textarea{resize:vertical}
.num{font-family:var(--font-mono);direction:ltr;unicode-bidi:isolate}
.sheet fieldset{border:0;padding:0;margin:0;min-width:0}
.sec{font-size:13px;font-weight:700;margin:0 0 8px;padding-bottom:4px;border-bottom:1px solid var(--paper-line)}
.tw{overflow-x:auto}
.tb{width:100%;border-collapse:collapse}
.tb th{font-size:11px;text-align:start;color:var(--paper-muted);background:var(--paper-soft);padding:6px 8px;border:1px solid var(--paper-line);white-space:nowrap}
.tb td{padding:0;border:1px solid var(--paper-line)} .tb td:first-child{padding:4px 8px;text-align:center;color:var(--paper-muted);width:34px}
.tb td input{border:0;border-radius:0;min-width:90px}
.cmts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.cmts{grid-template-columns:1fr}}
.cmt{border:1px solid var(--paper-line);border-radius:6px;padding:10px;display:grid;gap:8px;align-content:start}
.cmt h4{margin:0;font-size:13px}
.cmt .two{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.result{display:flex;gap:10px;flex-wrap:wrap}
.result label{display:flex;align-items:center;gap:8px;border:1px solid var(--paper-line);border-radius:6px;padding:8px 12px;cursor:pointer;color:var(--paper-ink);font-size:13px}
.result input{width:auto}
.stamp{display:inline-block;border:3px solid currentColor;border-radius:6px;padding:4px 14px;font:700 18px var(--font-mono);transform:rotate(-4deg);opacity:.9}
.stamp.B{color:var(--b)} .stamp.C{color:var(--c)}
.files{font-size:12px;color:var(--paper-muted);margin:6px 0 0}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function fld(F,fm){
  const id=F.id,val=get(fm,id),lab=T(F.ar,F.en),x=`x-${fm}-${id}`;
  if(F.t==='tbl'){const rs=tbl(fm,F);
    return `<div class="fld full"><span class="lbl">${lab}</span><div class="tw"><table class="tb"><thead><tr><th>#</th>${F.c.map(c=>`<th>${T(c[0],c[1])}</th>`).join('')}</tr></thead><tbody>${rs.map((r,ri)=>`<tr><td>${ri+1}</td>${r.map((v,ci)=>`<td><input id="${x}-${ri}-${ci}" aria-label="${esc(lab)} ${ri+1}.${ci+1}" data-tb="${id}" data-r="${ri}" data-c="${ci}" value="${esc(v)}"></td>`).join('')}</tr>`).join('')}</tbody></table></div><div><button type="button" class="btn small" data-act="addrow" data-id="${id}">+ ${T('إضافة صف','Add row')}</button></div></div>`}

  const logos=LOGO.map(l=>`<div class="logo"><label class="box" for="lg-${l[0]}">${S.logos[l[0]]?`<img src="${S.logos[l[0]]}" alt="${T(l[1],l[2])}">`:`<span>${T('شعار','Logo')}</span>`}<input type="file" accept="image/*" id="lg-${l[0]}" data-logo="${l[0]}"></label><span>${T(l[1],l[2])}</span></div>`).join('');
  const phase=draft?T('مرحلة التقديم','Submission stage'):sub?T('مرحلة التقفيل: بانتظار رد الاستشاري والمالك','Closure stage: awaiting consultant and owner'):T('مغلق','Closed');
  const cm=(k,ar,en,on)=>`<div class="cmt"><h4>${T(ar,en)}</h4><fieldset ${on?'':'disabled'}><div class="fld"><textarea id="c-${k}" aria-label="${T(ar,en)}" data-v="c_${k}" rows="4">${esc(get(fm,'c_'+k))}</textarea></div><div class="two" style="margin-top:8px"><input id="c-${k}-n" aria-label="${T('الاسم','Name')}" placeholder="${T('الاسم','Name')}" data-v="c_${k}_n" value="${esc(get(fm,'c_'+k+'_n'))}"><input id="c-${k}-d" type="date" aria-label="${T('التاريخ','Date')}" data-v="c_${k}_d" value="${esc(get(fm,'c_'+k+'_d'))}"></div></fieldset></div>`;
  return `<div class="sheet"><div class="logos">${logos}</div>
  <div class="title"><div><h2>${T(F.ar,F.en)}</h2><small>${F.k} · ${T(F.en,F.ar)}</small><span class="phase ${closed?st:''}">${phase}</span></div><div class="qr"><div id="qrbox"></div><span class="num">${esc(ref())}</span></div></div>
  <fieldset ${draft?'':'disabled'}><div class="refrow" style="margin-bottom:12px"><div class="fld"><label for="h-ref">${T('رقم الطلب','Request no.')}</label><input id="h-ref" class="num" readonly value="${esc(ref())}"></div><div class="fld"><label for="h-date">${T('التاريخ','Date')}</label><input id="h-date" type="date" data-v="date" value="${esc(get(fm,'date')||today)}"></div><div class="fld"><label for="h-rev">${T('المراجعة','Revision')}</label><input id="h-rev" data-v="rev" value="${esc(get(fm,'rev')||'0')}"></div></div>
  <div class="grid">${F.f.map(x=>fld(x,fm)).join('')}</div></fieldset>
  <fieldset ${draft?'':'disabled'}><p class="sec">${T('المرفقات','Attachments')}</p><input type="file" id="att" multiple data-files="1" aria-label="${T('إضافة مرفقات','Add attachments')}"><p class="files" id="fl">${(S.files[fm]||[]).map(esc).join(' · ')}</p></fieldset>
  <div><p class="sec">${T('تعليقات الأطراف','Party comments')}</p><div class="cmts">${cm('con','المقاول','Contractor',draft||sub?draft:false)}${cm('cs','الاستشاري','Consultant',sub)}${cm('own','المالك','Owner',sub)}</div></div>
  ${draft?'':`<div><p class="sec">${T('نتيجة الطلب','Request result')}</p>${closed?`<span class="stamp ${st}">${st==='B'?T('مقبول B','ACCEPTED B'):T('مرفوض C','REJECTED C')}</span>`:`<div class="result" role="radiogroup" aria-label="${T('النتيجة','Result')}"><label><input type="radio" name="res" id="res-b" value="B" data-res="B" ${S.res[fm]==='B'?'checked':''}>${T('B: مقبول','B: accepted')}</label><label><input type="radio" name="res" id="res-c" value="C" data-res="C" ${S.res[fm]==='C'?'checked':''}>${T('C: مرفوض، إعادة تقديم','C: rejected, resubmit')}</label></div>`}</div>`}
  </div>
  <div class="actions">${draft?`<button class="btn pri" data-act="submit">${T('تقديم الطلب','Submit request')}</button>`:sub?`<button class="btn pri" data-act="close">${T('تقفيل الطلب','Close request')}</button>`:`<button class="btn" data-act="reset">${T('بدء طلب جديد (عرض)','Start a new one (demo)')}</button>`}<span class="msg" id="msg"></span></div>`;
}
function drawQR(){const el=$('#qrbox');if(!el)return;el.innerHTML='';
  try{new QRCode(el,{text:ref(),width:84,height:84,correctLevel:QRCode.CorrectLevel.M})}catch(_){el.textContent='QR'}}
function render(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  const st=stat(),sIdx=st==='draft'?0:st==='submitted'?1:2;
  $('#app').innerHTML=`<div class="wrap"><header class="top"><div class="brand"><span class="mark">SD</span><span>SiteDocs Forms</span><small>${T('فورمات أونلاين: تُقدَّم وتُقفَل داخل البرنامج بلا طباعة','Online forms: submitted and closed inside the app, no printing')}</small></div><button class="btn" data-act="lang">${lang==='ar'?'English':'العربية'}</button></header>
  <div class="layout"><nav class="list" aria-label="${T('الفورمات','Forms')}">${FORMS.map(x=>`<button data-act="form" data-k="${x.k}" aria-current="${S.form===x.k}"><b>${x.k}</b><span>${T(x.ar,x.en)}</span></button>`).join('')}</nav>
  <main><div class="bar"><div class="r"><label>${T('كود المقاول','Contractor code')}<input id="cf-co" class="num" data-cfg="co" value="${S.cfg.co}"></label><label>${T('كود الاستشاري','Consultant code')}<input id="cf-cs" class="num" data-cfg="cs" value="${S.cfg.cs}"></label><label>${T('كود المشروع','Project code')}<input id="cf-pj" class="num" data-cfg="pj" value="${S.cfg.pj}"></label><label>${T('التخصص','Discipline')}<select id="cf-disc" data-cfg="disc">${DC.map((d,i)=>`<option value="${d}" ${S.cfg.disc===d?'selected':''}>${d} · ${T(D[i][0],D[i][1])}</option>`).join('')}</select></label><label>${T('الرقم المتسلسل','Serial')}<input id="cf-sn" class="num" inputmode="numeric" data-cfg="serial" value="${S.cfg.serial}"></label></div>
  <div class="steps" id="steps">${[T('تقديم','Submit'),T('بانتظار الرد','Awaiting reply'),T('مقفل B / C','Closed B / C')].map((s,i)=>`<span class="step ${i===sIdx?'on':''}">${i+1}. ${s}</span>`).join('')}<span class="note">${T('البيانات الظاهرة في WIR أمثلة. الشعارات تُرفع من جهازك.','The WIR values shown are examples. Logos are uploaded from your device.')}</span></div></div>
  <div id="sheet">${sheet()}</div></main></div></div>`;
  drawQR();
}
function renderSheet(){const s=$('#sheet');if(s){s.innerHTML=sheet();drawQR()}const st=stat(),i=st==='draft'?0:st==='submitted'?1:2;document.querySelectorAll('#steps .step').forEach((e,k)=>e.classList.toggle('on',k===i))}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;const k=a.dataset.act;
  if(k==='lang'){lang=lang==='ar'?'en':'ar';render()}
  else if(k==='form'){S.form=a.dataset.k;render()}
  else if(k==='addrow'){const F=FORMS.find(x=>x.k===S.form).f.find(x=>x.id===a.dataset.id);tbl(S.form,F).push(F.c.map(()=>''));renderSheet()}
  else if(k==='submit'){S.status[S.form]='submitted';renderSheet()}
  else if(k==='close'){const r=S.res[S.form];if(!r){$('#msg').textContent=T('اختر النتيجة B أو C أولًا','Choose result B or C first');return}S.status[S.form]=r;renderSheet()}
  else if(k==='reset'){S.status[S.form]='draft';S.res[S.form]=null;S.v[S.form]={};S.files[S.form]=[];renderSheet()}
});
document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(d.v!==undefined)set(S.form,d.v,t.value);
  else if(d.tb){const F=FORMS.find(x=>x.k===S.form).f.find(x=>x.id===d.tb);tbl(S.form,F)[+d.r][+d.c]=t.value}
  else if(d.cfg){let v=t.value;if(d.cfg==='serial')v=v.replace(/\D/g,'').slice(0,4);else if(d.cfg!=='disc')v=v.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);S.cfg[d.cfg]=v||S.cfg[d.cfg];
    const h=$('#h-ref');if(h)h.value=ref();const sp=document.querySelector('.qr .num');if(sp)sp.textContent=ref();drawQR()}
});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;
  if(d.res){S.res[S.form]=d.res;const m=$('#msg');if(m)m.textContent=''}
  else if(d.logo&&t.files&&t.files[0]){const fr=new FileReader();fr.onload=()=>{S.logos[d.logo]=fr.result;renderSheet()};fr.readAsDataURL(t.files[0])}
  else if(d.files){S.files[S.form]=Array.from(t.files).map(x=>x.name);const el=$('#fl');if(el)el.textContent=S.files[S.form].join(' · ')}
});
render();
</script>

</body></html>
