<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>نبذة خمسات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Concept: a short copy desk. One page, each text block with its own copy button. Same petrol palette as SiteDocs. */
:root{
  --bg:#eceff3; --surface:#ffffff; --surface-2:#f3f5f8; --ink:#16202e; --muted:#566275; --line:#d3d9e2;
  --accent:#0b5c72; --on-accent:#ffffff; --accent-soft:#dcedf2; --hl:#fbe9b8; --on-hl:#3d2a00;
  --font-ui:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#17202a; --surface-2:#1e2935; --ink:#e7ecf2; --muted:#9aa7b7; --line:#2b3745;
  --accent:#52b8d4; --on-accent:#08212a; --accent-soft:#143240; --hl:#5a4510; --on-hl:#ffe9ad; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#17202a; --surface-2:#1e2935; --ink:#e7ecf2; --muted:#9aa7b7; --line:#2b3745;
  --accent:#52b8d4; --on-accent:#08212a; --accent-soft:#143240; --hl:#5a4510; --on-hl:#ffe9ad; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.85 var(--font-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin-inline:auto;padding-block:20px 56px;display:grid;gap:18px}
h1{font-size:24px;line-height:1.4;margin:0;text-wrap:balance} h2{font-size:15px;margin:0}
.lead{color:var(--muted);margin:4px 0 0;font-size:14px;line-height:1.7}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px;min-width:0}
.hd{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.txt{white-space:pre-wrap;margin:0;overflow-wrap:anywhere}
.btn{font:inherit;font-size:13px;padding:6px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.ok{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
mark{background:var(--hl);color:var(--on-hl);border-radius:3px;padding-inline:3px}
.hl{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.hl li{border-top:1px solid var(--line);padding-top:8px} .hl li:first-child{border-top:0;padding-top:0}
.tips{margin:0;padding-inline-start:20px;color:var(--muted);font-size:14px;line-height:1.8}
.cnt{font-size:12px;color:var(--muted)}
</style>
<div class="wrap" id="app"></div>
<script>
document.documentElement.lang='ar';document.documentElement.dir='rtl';
const B=[
 {t:'العنوان (اختر واحدًا)',list:[
  'أنظّم مستندات مشروعك وأؤرشفها، لتصل إلى أي ورقة في دقائق',
  'منسّق مستندات (Document Control) لمشاريع المقاولات والعقارات',
  'لا طلبات ضائعة ولا مرفوضات منسية: أرشفة وتتبّع لمستندات الموقع']},
 {t:'النبذة الكاملة',txt:`هل ضاع منك طلب استلام (WIR) وقت التسليم؟
هل تأخّر اعتماد أعمالك لأن أحدًا لم يجد الخطاب الصحيح؟
هل طلب منك الاستشاري مستندًا قديمًا، فقضيت يومًا كاملًا تبحث عنه؟

هذه المشكلات لا تعني أن فريقك مقصّر. تعني أن المستندات ليس لها نظام واضح، وهنا يبدأ عملي.

أنا [اسمك]، متخصص في حفظ المستندات والأرشفة (Document Control) لشركات المقاولات والتطوير العقاري والمكاتب الاستشارية، وخبرتي [عدد] سنوات في مشاريع [مصر / السعودية / الإمارات].

أنا لا أرتّب ملفاتك فقط. أحلّ المشكلة من أصلها:

• أضع نظام ترقيم موحّدًا لكل طلب ومراسلة (WIR وMIR وRFI وNCR وغيرها)، فيعرف الجميع من الرقم وحده: المشروع والتخصص ونوع الطلب.
• أنظّم الأرشيف في مجلدات حسب التخصص (معماري، إنشائي، ميكانيكا، كهرباء)، ورقيًا وإلكترونيًا.
• أتابع الطلبات المرفوضة (Code C) وأنبّهك قبل أن يتعطل العمل بسبب إعادة تقديم متأخرة.
• أجهّز تقارير أسبوعية وشهرية بنسب القبول والرفض (Code B وCode C)، لتعرف أين المشكلة.
• أجهّز ملف التسليم النهائي مرتبًا، فلا ينتظر المالك أو الاستشاري ورقة ناقصة.

ماذا تستفيد؟
- وقت أقل في البحث، ومراجعات أسرع.
- طلبات مرفوضة أقل، لأنك ترى الأسباب المتكررة للرفض.
- أرشيف جاهز عند أي نزاع أو تدقيق.

كيف نبدأ؟
1. ترسل لي وصفًا بسيطًا لوضع مستنداتك الحالية.
2. أعطيك خطة مبدئية وسعرًا واضحًا قبل أي التزام.
3. أنفّذ وأسلّمك أرشيفًا منظمًا مع شرح مختصر لطريقة الحفاظ عليه.

راسلني الآن قبل أن يتراكم الورق، وأخبرك من أين نبدأ.`},
 {t:'نسخة قصيرة (للمعاينة وصفحة الخدمة)',txt:`متخصص في حفظ المستندات والأرشفة لمشاريع المقاولات والعقارات. أنظّم ترقيم الطلبات (WIR / MIR / RFI / NCR)، وأرتّب الأرشيف حسب التخصص، وأتابع الطلبات المرفوضة، وأجهّز تقارير القبول والرفض. النتيجة: تصل إلى أي مستند بسرعة، وتقلّ المراجعات والتأخير. راسلني بوصف وضع ملفاتك وأعطيك خطة مبدئية.`}
];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mk=s=>esc(s).replace(/\[([^\]]+)\]/g,'<mark>[$1]</mark>');
let html=`<header><h1>نبذة خمسات / مستقل</h1><p class="lead">الكلمات داخل الأقواس المظللة تخصّك، عدّلها قبل النشر. زر النسخ يأخذ النص كما هو.</p></header>`;
B.forEach((b,i)=>{
  if(b.list){html+=`<section class="card"><div class="hd"><h2>${b.t}</h2></div><ul class="hl">${b.list.map((x,j)=>`<li><div class="hd"><span class="txt">${mk(x)}</span><button class="btn" data-copy="${i}-${j}">نسخ</button></div></li>`).join('')}</ul></section>`}
  else{html+=`<section class="card"><div class="hd"><h2>${b.t}</h2><span><span class="cnt">${b.txt.length} حرفًا</span> <button class="btn" data-copy="${i}">نسخ</button></span></div><p class="txt">${mk(b.txt)}</p></section>`}
});
html+=`<section class="card"><h2>قبل النشر</h2><ul class="tips"><li>اكتب رقم خبرتك الحقيقي فقط، ولا تذكر عملاء أو أرقامًا لم تحققها.</li><li>أضف نموذجًا حقيقيًا لعملك: صورة لهيكل مجلدات مرتب أو تقرير B/C (بعد إخفاء أسماء الشركات).</li><li>ضع في العنوان التخصص الأقرب لعميلك: مقاولات أو تطوير عقاري أو استشاري.</li></ul></section>`;
document.getElementById('app').innerHTML=html;
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-copy]');if(!b)return;
  const [i,j]=b.dataset.copy.split('-'),txt=j!==undefined?B[i].list[j]:B[i].txt;
  const done=()=>{b.textContent='تم النسخ';b.classList.add('ok');setTimeout(()=>{b.textContent='نسخ';b.classList.remove('ok')},1600)};
  const fb=()=>{const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy');done()}catch(_){b.textContent='حدّد النص يدويًا'}t.remove()};
  try{navigator.clipboard.writeText(txt).then(done,fb)}catch(_){fb()}
});
</script>

</body></html>
